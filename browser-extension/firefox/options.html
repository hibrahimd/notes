<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Not Al — Ayarlar</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --card: #ffffff;
        --text: #18181b;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #18181b;
        --accent-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --card: #18181b;
          --text: #fafafa;
          --muted: #a1a1aa;
          --border: #27272a;
          --accent: #fafafa;
          --accent-text: #18181b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 32px 20px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        max-width: 520px;
        margin: 0 auto;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 24px;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.sub { color: var(--muted); margin: 0 0 20px; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
      }
      .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
      button {
        padding: 9px 16px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-text);
        border-color: var(--accent);
      }
      button:hover { opacity: 0.85; }
      .status { margin-top: 14px; font-size: 13px; min-height: 20px; }
      .ok { color: #10b981; }
      .err { color: #ef4444; }
      .hint {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
      }
      .hint a { color: inherit; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Not Al</h1>
      <p class="sub">
        Sağ tık menüsünden sayfa, link, görsel veya seçili metni kaydeder.
      </p>

      <label for="token">API Token</label>
      <input id="token" type="text" placeholder="notal_..." spellcheck="false" />

      <div class="row">
        <button id="save" class="primary">Kaydet</button>
        <button id="fetch">Oturumdan Al</button>
        <button id="test">Bağlantıyı Sına</button>
      </div>

      <div id="status" class="status"></div>

      <p class="hint">
        &quot;Oturumdan Al&quot;, bu tarayıcıda
        <a href="https://notes.kronomondo.org/dashboard" target="_blank"
          >Not Al&apos;a giriş yapmışsan</a
        >
        token&apos;ı kendiliğinden çeker. Yapmadıysan Mobil Kurulum sayfasındaki
        token&apos;ı buraya yapıştır.
      </p>
    </div>

    <script src="options.js"></script>
  </body>
</html>
