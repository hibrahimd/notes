services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://notal:${DB_PASSWORD}@postgres:5432/notal
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - STORAGE_PATH=/data/notal-storage
      - NODE_ENV=production
    volumes:
      - notal-storage:/data/notal-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - notal-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql://notal:${DB_PASSWORD}@postgres:5432/notal
      - REDIS_URL=redis://redis:6379
      - STORAGE_PATH=/data/notal-storage
      - NODE_ENV=production
    volumes:
      - notal-storage:/data/notal-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - notal-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=notal
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=notal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notal"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - notal-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - notal-network

volumes:
  postgres-data:
  redis-data:
  notal-storage:

networks:
  notal-network:
    driver: bridge
