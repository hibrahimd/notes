services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://notal:${DB_PASSWORD}@notal-db:5432/notal
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - STORAGE_PATH=/data/notal-storage
      - NODE_ENV=production
    volumes:
      - notal-storage:/data/notal-storage
    depends_on:
      notal-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notal.rule=Host(`notes.kronomondo.org`)"
      - "traefik.http.routers.notal.entrypoints=http"
      - "traefik.http.services.notal.loadbalancer.server.port=3000"
      - "traefik.http.routers.notal-secure.rule=Host(`notes.kronomondo.org`)"
      - "traefik.http.routers.notal-secure.entrypoints=https"
      - "traefik.http.routers.notal-secure.tls=true"
      - "traefik.http.routers.notal-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.notal-secure.service=notal"
    networks:
      - notal-network
      - coolify

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql://notal:${DB_PASSWORD}@notal-db:5432/notal
      - REDIS_URL=redis://redis:6379
      # Worker, kullanicilarin sifreli OpenAI anahtarlarini cozmek zorunda
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - STORAGE_PATH=/data/notal-storage
      - NODE_ENV=production
    volumes:
      - notal-storage:/data/notal-storage
    depends_on:
      notal-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - notal-network

  notal-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=notal
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=notal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notal"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - notal-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - notal-network

volumes:
  postgres-data:
  redis-data:
  notal-storage:

networks:
  notal-network:
    driver: bridge
  coolify:
    external: true
